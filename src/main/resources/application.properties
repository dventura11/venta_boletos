# Base de datos H2 persistente en archivo dentro del proyecto (./data/).
# Con "bazel run", BUILD_WORKSPACE_DIRECTORY apunta a la raiz del proyecto;
# si se corre de otra forma, cae a la carpeta actual.
spring.datasource.url=jdbc:h2:file:${BUILD_WORKSPACE_DIRECTORY:.}/data/ticketera;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
