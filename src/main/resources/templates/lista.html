<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticketera</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <a th:href="@{/}" title="Inicio" class="d-inline-flex align-items-center text-decoration-none mb-3"><span style="font-size:1.8rem;">🎟️</span>&nbsp;<strong class="fs-4 text-dark">Ticketera</strong></a>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🎤 Conciertos</h2>
        <a th:href="@{/conciertos/nuevo}" class="btn btn-success">➕ Nuevo concierto</a>
    </div>

    <div class="input-group mb-3">
        <span class="input-group-text">🔎</span>
        <input type="text" id="busqueda" class="form-control" placeholder="Buscar por artista, recinto o ciudad..." oninput="buscar()">
    </div>

    <table class="table table-hover align-middle shadow-sm bg-white rounded">
        <thead class="table-light">
            <tr>
                <th>🎸 Artistas</th><th>🏟️ Recinto</th><th>📅 Fecha</th><th>🕖 Hora</th>
                <th>🔞 Edad</th><th>🛒 Canales</th><th>💺 Asientos</th><th>🎟️ Boletos</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla">
            <tr th:each="c : ${conciertos}">
                <td>
                    <span th:each="a : ${c.artistas}" class="badge rounded-pill bg-primary-subtle text-primary-emphasis border border-primary-subtle me-1">🎸 <span th:text="${a.nombre}"></span></span>
                </td>
                <td>
                    <div th:if="${c.recinto != null}">
                        <span class="fw-semibold" th:text="'🏟️ ' + ${c.recinto.nombre}"></span><br>
                        <small class="text-muted" th:text="'📍 ' + ${c.recinto.ciudad}"></small>
                    </div>
                </td>
                <td th:text="${c.fecha}"></td>
                <td th:text="${c.hora}"></td>
                <td>
                    <span class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle"
                          th:text="${c.restriccionEdad != null and c.restriccionEdad > 0 ? '🔞 +' + c.restriccionEdad : '👪 Libre'}"></span>
                </td>
                <td>
                    <span th:each="canal : ${c.canalesVenta}" class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis border me-1"
                          th:text="(${canal} == 'En línea' ? '💻 ' : (${canal} == 'Efectivo' ? '💵 ' : '🎫 ')) + ${canal}"></span>
                </td>
                <td>
                    <span th:each="a : ${c.asientos}" class="badge rounded-pill bg-success-subtle text-success-emphasis border border-success-subtle me-1 mb-1"
                          th:text="'💺 ' + ${a.tipoAsiento.nombre} + ' · 💲' + ${a.precio} + ' · 🎟️' + ${a.boletosDisponibles}"></span>
                </td>
                <td><span class="badge bg-dark" th:text="${c.totalBoletosDisponibles}"></span></td>
                <td class="text-nowrap">
                    <a th:href="@{/conciertos/comprar/{id}(id=${c.id})}" class="btn btn-sm btn-primary">🎟️ Comprar</a>
                    <a th:href="@{/conciertos/editar/{id}(id=${c.id})}" class="btn btn-sm btn-warning">✏️</a>
                    <a th:href="@{/conciertos/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-danger">🗑️</a>
                </td>
            </tr>
        </tbody>
    </table>

    <script>
        function badge(cls, txt) { return '<span class="badge rounded-pill ' + cls + ' border me-1 mb-1">' + txt + '</span>'; }
        function iconCanal(c) { return c === 'En línea' ? '💻 ' : (c === 'Efectivo' ? '💵 ' : '🎫 '); }
        function buscar() {
            var q = document.getElementById("busqueda").value;
            fetch("/api/conciertos/buscar?q=" + encodeURIComponent(q))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var tbody = document.getElementById("tabla");
                    tbody.innerHTML = "";
                    data.forEach(function (c) {
                        var artistas = (c.artistas || []).map(function (a) {
                            return badge('bg-primary-subtle text-primary-emphasis', '🎸 ' + a.nombre);
                        }).join("");
                        var recinto = c.recinto ? ('<span class="fw-semibold">🏟️ ' + c.recinto.nombre + '</span><br><small class="text-muted">📍 ' + c.recinto.ciudad + '</small>') : '';
                        var edad = badge('bg-warning-subtle text-warning-emphasis',
                            (c.restriccionEdad && c.restriccionEdad > 0) ? ('🔞 +' + c.restriccionEdad) : '👪 Libre');
                        var canales = (c.canalesVenta || []).map(function (x) {
                            return badge('bg-secondary-subtle text-secondary-emphasis', iconCanal(x) + x);
                        }).join("");
                        var asientos = (c.asientos || []).map(function (a) {
                            return badge('bg-success-subtle text-success-emphasis', '💺 ' + a.tipoAsiento.nombre + ' · 💲' + a.precio + ' · 🎟️' + a.boletosDisponibles);
                        }).join("");
                        var total = (c.asientos || []).reduce(function (s, a) { return s + (a.boletosDisponibles || 0); }, 0);
                        tbody.innerHTML +=
                            "<tr><td>" + artistas + "</td><td>" + recinto +
                            "</td><td>" + (c.fecha || "") + "</td><td>" + (c.hora || "") +
                            "</td><td>" + edad + "</td><td>" + canales + "</td><td>" + asientos +
                            "</td><td><span class='badge bg-dark'>" + total + "</span></td><td class='text-nowrap'>" +
                            "<a href='/conciertos/comprar/" + c.id + "' class='btn btn-sm btn-primary'>🎟️ Comprar</a> " +
                            "<a href='/conciertos/editar/" + c.id + "' class='btn btn-sm btn-warning'>✏️</a> " +
                            "<a href='/conciertos/eliminar/" + c.id + "' class='btn btn-sm btn-danger'>🗑️</a>" +
                            "</td></tr>";
                    });
                });
        }
    </script>
</body>
</html>
