<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticketera</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <div class="text-center mb-5">
        <h1 class="display-5">🎟️ Ticketera</h1>
        <p class="text-muted">Sistema de venta de boletos para conciertos</p>
    </div>

    <div class="list-group shadow-sm">
        <a th:href="@{/conciertos}" class="list-group-item list-group-item-action d-flex align-items-center">
            <span class="me-3" style="font-size: 2.2rem;">🎤</span>
            <span>
                <h5 class="mb-1">Conciertos</h5>
                <small class="text-muted">Ver, buscar, comprar, editar y eliminar conciertos</small>
            </span>
        </a>
        <a th:href="@{/recintos}" class="list-group-item list-group-item-action d-flex align-items-center">
            <span class="me-3" style="font-size: 2.2rem;">🏟️</span>
            <span>
                <h5 class="mb-1">Recintos</h5>
                <small class="text-muted">Gestionar recintos y sus tipos de asiento</small>
            </span>
        </a>
        <a th:href="@{/artistas}" class="list-group-item list-group-item-action d-flex align-items-center">
            <span class="me-3" style="font-size: 2.2rem;">🎸</span>
            <span>
                <h5 class="mb-1">Artistas</h5>
                <small class="text-muted">Gestionar artistas</small>
            </span>
        </a>
    </div>
</body>
</html>
