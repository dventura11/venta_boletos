<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprar / Cancelar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 520px;">
    <a th:href="@{/}" title="Inicio" class="d-inline-flex align-items-center text-decoration-none mb-3"><span style="font-size:1.8rem;">🎟️</span>&nbsp;<strong class="fs-4 text-dark">Ticketera</strong></a>
    <div class="card shadow p-4">
        <h3>
            <span th:each="a, it : ${concierto.artistas}" th:text="${a.nombre} + (${it.last} ? '' : ', ')"></span>
        </h3>
        <p class="text-muted mb-1"
           th:text="(${concierto.recinto != null} ? ${concierto.recinto.nombre} + ' · ' + ${concierto.recinto.ciudad} : '')"></p>
        <p class="text-muted mb-1" th:text="${concierto.fecha} + ' · ' + ${concierto.hora}"></p>
        <p class="mb-1">
            <span class="badge bg-secondary"
                  th:text="${concierto.restriccionEdad != null and concierto.restriccionEdad > 0 ? 'Edad mínima +' + concierto.restriccionEdad : 'Todas las edades'}"></span>
        </p>
        <p class="text-muted small">
            Canales de venta:
            <span th:each="canal, it : ${concierto.canalesVenta}" th:text="${canal} + (${it.last} ? '' : ', ')"></span>
        </p>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <h5 class="mt-3">🛒 Comprar</h5>
        <form th:action="@{/conciertos/comprar/procesar}" method="post">
            <div class="mb-3">
                <label class="form-label">Tipo de asiento:</label>
                <select name="asientoId" class="form-select" id="sel" onchange="calc()">
                    <option th:each="a : ${concierto.asientos}"
                            th:value="${a.id}"
                            th:attr="data-p=${a.precio}"
                            th:disabled="${a.boletosDisponibles <= 0}"
                            th:text="${a.tipoAsiento.nombre} + ' - $' + ${a.precio} + ' (' + ${a.boletosDisponibles} + ' disponibles)'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Cantidad:</label>
                <input type="number" name="cantidad" id="cant" class="form-control" value="1" min="1" oninput="calc()" required />
            </div>
            <h5 class="text-center alert alert-info">Total: $<span id="t">0</span></h5>
            <button type="submit" class="btn btn-primary w-100"
                    th:disabled="${concierto.totalBoletosDisponibles <= 0}">🎟️ Comprar</button>
        </form>

        <hr>
        <h5>↩️ Cancelar boletos</h5>
        <form th:action="@{/conciertos/cancelar/procesar}" method="post">
            <div class="mb-3">
                <label class="form-label">Tipo de asiento:</label>
                <select name="asientoId" class="form-select">
                    <option th:each="a : ${concierto.asientos}"
                            th:value="${a.id}"
                            th:text="${a.tipoAsiento.nombre} + ' (' + ${a.boletosDisponibles} + '/' + ${a.tipoAsiento.capacidad} + ')'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Cantidad:</label>
                <input type="number" name="cantidad" class="form-control" value="1" min="1" required />
            </div>
            <button type="submit" class="btn btn-outline-danger w-100">↩️ Cancelar boletos</button>
        </form>

        <a th:href="@{/conciertos}" class="btn btn-secondary w-100 mt-3">⬅️ Volver</a>
    </div>
    <script>
        function calc() {
            var s = document.getElementById("sel");
            if (!s || s.selectedIndex < 0) { document.getElementById("t").innerText = 0; return; }
            var p = s.options[s.selectedIndex].getAttribute("data-p");
            var c = document.getElementById("cant").value;
            document.getElementById("t").innerText = (p ? p : 0) * (c ? c : 0);
        }
        calc();
    </script>
</body>
</html>
