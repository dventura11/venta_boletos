<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Concierto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 720px;">
    <a th:href="@{/}" title="Inicio" class="d-inline-flex align-items-center text-decoration-none mb-3"><span style="font-size:1.8rem;">🎟️</span>&nbsp;<strong class="fs-4 text-dark">Ticketera</strong></a>
    <div class="card shadow p-4">
        <h3 th:text="${concierto.id} == null ? 'Nuevo concierto' : 'Editar concierto'"></h3>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/conciertos/guardar}" th:object="${concierto}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label">Artistas (puedes elegir varios)</label>
                <input type="text" id="filtroArtistas" class="form-control mb-2"
                       placeholder="Filtrar artistas por nombre o género..." onkeyup="filtrarArtistas()" />
                <div class="border rounded p-2" style="max-height: 180px; overflow-y: auto;">
                    <div class="form-check artista-item" th:each="a : ${artistas}"
                         th:attr="data-filtro=${#strings.toLowerCase(a.nombre + ' ' + (a.genero != null ? a.genero : ''))}">
                        <input class="form-check-input" type="checkbox" name="artistaIds"
                               th:id="${'art-' + a.id}" th:value="${a.id}"
                               th:checked="${#lists.contains(idsSel, a.id)}" />
                        <label class="form-check-label" th:for="${'art-' + a.id}"
                               th:text="${a.nombre} + (${a.genero} != null ? ' (' + ${a.genero} + ')' : '')"></label>
                    </div>
                    <div class="text-muted small" th:if="${#lists.isEmpty(artistas)}">No hay artistas. Crea uno primero.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Recinto</label>
                <select th:field="*{recinto.id}" id="recinto" class="form-select" required onchange="cargarTipos(this.value)">
                    <option value="">-- Selecciona --</option>
                    <option th:each="r : ${recintos}" th:value="${r.id}" th:text="${r.nombre} + ' - ' + ${r.ciudad}"></option>
                </select>
            </div>

            <div class="row">
                <div class="col mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" th:field="*{fecha}" class="form-control"
                           th:min="${T(java.time.LocalDate).now()}" required />
                </div>
                <div class="col mb-3">
                    <label class="form-label">Hora de inicio</label>
                    <input type="time" th:field="*{hora}" class="form-control" required />
                </div>
                <div class="col mb-3">
                    <label class="form-label">Edad mínima</label>
                    <input type="number" min="0" th:field="*{restriccionEdad}" class="form-control" />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">🛒 Canales de venta</label>
                <div class="form-check form-check-inline" th:each="canal : ${canalesDisponibles}">
                    <input class="form-check-input" type="checkbox" th:field="*{canalesVenta}" th:value="${canal}" />
                    <label class="form-check-label" th:text="${canal}"></label>
                </div>
            </div>

            <hr>
            <h5>💺 Precios por tipo de asiento</h5>
            <p class="text-muted small">Los tipos de asiento y la capacidad los define el recinto. Aquí solo defines el precio.</p>
            <table class="table align-middle">
                <thead><tr><th>Tipo</th><th>Capacidad</th><th>Precio</th></tr></thead>
                <tbody id="asientos">
                    <tr th:each="asiento, iter : *{asientos}">
                        <td>
                            <input type="hidden" th:name="|asientos[${iter.index}].id|" th:value="${asiento.id}" />
                            <input type="hidden" th:name="|asientos[${iter.index}].tipoAsiento.id|" th:value="${asiento.tipoAsiento.id}" />
                            <input type="hidden" th:name="|asientos[${iter.index}].boletosDisponibles|" th:value="${asiento.boletosDisponibles}" />
                            <span th:text="${asiento.tipoAsiento.nombre}"></span>
                        </td>
                        <td th:text="${asiento.tipoAsiento.capacidad}"></td>
                        <td><input type="number" step="0.01" min="0" th:name="|asientos[${iter.index}].precio|" th:value="${asiento.precio}" class="form-control" /></td>
                    </tr>
                </tbody>
            </table>

            <button type="submit" class="btn btn-primary w-100">💾 Guardar</button>
            <a th:href="@{/conciertos}" class="btn btn-secondary w-100 mt-2">✖️ Cancelar</a>
        </form>
    </div>

    <script>
        function filtrarArtistas() {
            var q = document.getElementById("filtroArtistas").value.toLowerCase();
            var items = document.querySelectorAll(".artista-item");
            for (var i = 0; i < items.length; i++) {
                var txt = items[i].getAttribute("data-filtro") || "";
                items[i].style.display = txt.indexOf(q) >= 0 ? "" : "none";
            }
        }
        function cargarTipos(recintoId) {
            var tbody = document.getElementById("asientos");
            tbody.innerHTML = "";
            if (!recintoId) { return; }
            fetch("/api/recintos/" + recintoId + "/tipos")
                .then(function (r) { return r.json(); })
                .then(function (tipos) {
                    tipos.forEach(function (t, i) {
                        var tr = document.createElement("tr");
                        tr.innerHTML =
                            '<td>' +
                            '<input type="hidden" name="asientos[' + i + '].tipoAsiento.id" value="' + t.id + '" />' +
                            t.nombre +
                            '</td>' +
                            '<td>' + (t.capacidad == null ? '' : t.capacidad) + '</td>' +
                            '<td><input type="number" step="0.01" min="0" name="asientos[' + i + '].precio" class="form-control" value="' +
                            (t.precioSugerido == null ? '' : t.precioSugerido) + '" /></td>';
                        tbody.appendChild(tr);
                    });
                });
        }
    </script>
</body>
</html>
