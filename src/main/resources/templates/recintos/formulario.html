<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recinto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 700px;">
    <a th:href="@{/}" title="Inicio" class="d-inline-flex align-items-center text-decoration-none mb-3"><span style="font-size:1.8rem;">🎟️</span>&nbsp;<strong class="fs-4 text-dark">Ticketera</strong></a>
    <div class="card shadow p-4">
        <h3 th:text="${recinto.id} == null ? 'Nuevo recinto' : 'Editar recinto'"></h3>
        <form th:action="@{/recintos/guardar}" th:object="${recinto}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Ciudad</label>
                <input type="text" th:field="*{ciudad}" class="form-control" required />
            </div>

            <hr>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">💺 Tipos de asiento</h5>
                <button type="button" class="btn btn-sm btn-success" onclick="agregarTipo()">➕ Agregar tipo</button>
            </div>
            <table class="table align-middle">
                <thead>
                    <tr><th>Nombre</th><th>Capacidad</th><th>Precio sugerido</th><th></th></tr>
                </thead>
                <tbody id="tipos">
                    <tr th:each="tipo, iter : *{tiposAsiento}">
                        <td>
                            <input type="hidden" th:name="|tiposAsiento[${iter.index}].id|" th:value="${tipo.id}" />
                            <input type="text" th:name="|tiposAsiento[${iter.index}].nombre|" th:value="${tipo.nombre}" class="form-control" />
                        </td>
                        <td><input type="number" min="0" th:name="|tiposAsiento[${iter.index}].capacidad|" th:value="${tipo.capacidad}" class="form-control" /></td>
                        <td><input type="number" step="0.01" min="0" th:name="|tiposAsiento[${iter.index}].precioSugerido|" th:value="${tipo.precioSugerido}" class="form-control" /></td>
                        <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">&times;</button></td>
                    </tr>
                </tbody>
            </table>

            <button type="submit" class="btn btn-primary w-100">💾 Guardar</button>
            <a th:href="@{/recintos}" class="btn btn-secondary w-100 mt-2">✖️ Cancelar</a>
        </form>
    </div>

    <script th:inline="javascript">
        var indice = /*[[${recinto.tiposAsiento.size()}]]*/ 0;
        function agregarTipo() {
            var tbody = document.getElementById("tipos");
            var tr = document.createElement("tr");
            tr.innerHTML =
                '<td>' +
                '<input type="hidden" name="tiposAsiento[' + indice + '].id" value="" />' +
                '<input type="text" name="tiposAsiento[' + indice + '].nombre" class="form-control" placeholder="VIP" />' +
                '</td>' +
                '<td><input type="number" min="0" name="tiposAsiento[' + indice + '].capacidad" class="form-control" /></td>' +
                '<td><input type="number" step="0.01" min="0" name="tiposAsiento[' + indice + '].precioSugerido" class="form-control" /></td>' +
                '<td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest(\'tr\').remove()">&times;</button></td>';
            tbody.appendChild(tr);
            indice++;
        }
        if (indice === 0) { agregarTipo(); }
    </script>
</body>
</html>
