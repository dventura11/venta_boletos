<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticketera</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <a th:href="@{/}" title="Inicio" class="d-inline-flex align-items-center text-decoration-none mb-3"><span style="font-size:1.8rem;">🎟️</span>&nbsp;<strong class="fs-4 text-dark">Ticketera</strong></a>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🎸 Artistas</h2>
        <a th:href="@{/artistas/nuevo}" class="btn btn-success">➕ Nuevo artista</a>
    </div>
    <table class="table table-hover align-middle shadow-sm bg-white rounded">
        <thead class="table-light"><tr><th>🎤 Nombre</th><th>🎵 Género</th><th>Acciones</th></tr></thead>
        <tbody>
            <tr th:each="a : ${artistas}">
                <td class="fw-semibold" th:text="'🎤 ' + ${a.nombre}"></td>
                <td>
                    <span th:if="${a.genero != null and !a.genero.isEmpty()}" class="badge rounded-pill bg-primary-subtle text-primary-emphasis border border-primary-subtle"
                          th:text="'🎵 ' + ${a.genero}"></span>
                </td>
                <td class="text-nowrap">
                    <a th:href="@{/artistas/editar/{id}(id=${a.id})}" class="btn btn-sm btn-warning">✏️</a>
                    <a th:href="@{/artistas/eliminar/{id}(id=${a.id})}" class="btn btn-sm btn-danger">🗑️</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
