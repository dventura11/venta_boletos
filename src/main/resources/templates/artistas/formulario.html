<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Artista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <a th:href="@{/}" title="Inicio" class="d-inline-flex align-items-center text-decoration-none mb-3"><span style="font-size:1.8rem;">🎟️</span>&nbsp;<strong class="fs-4 text-dark">Ticketera</strong></a>
    <div class="card shadow p-4">
        <h3 th:text="${artista.id} == null ? 'Nuevo artista' : 'Editar artista'"></h3>
        <form th:action="@{/artistas/guardar}" th:object="${artista}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Género</label>
                <input type="text" th:field="*{genero}" class="form-control" placeholder="Rock, Pop..." required />
            </div>
            <button type="submit" class="btn btn-primary w-100">💾 Guardar</button>
            <a th:href="@{/artistas}" class="btn btn-secondary w-100 mt-2">✖️ Cancelar</a>
        </form>
    </div>
</body>
</html>
